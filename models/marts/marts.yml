version: 2

models:
  - name: orders_clean
    description: Orders that passed every quality rule
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: country
        data_tests:
          - accepted_values:
              arguments:
                values: ["France", "Germany", "Italy", "Morocco", "Tunisia"]
              config:
                severity: warn

  - name: revenue_by_country
    description: Revenue per country, read by the sales director
    config:
      contract:
        enforced: true
    columns:
      - name: country
        data_type: varchar
        data_tests:
          - unique
      - name: revenue
        data_type: decimal(38,2)

  - name: revenue_by_product
    description: Revenue per product, for the analysts
    columns:
      - name: product
        data_tests:
          - unique
