version: 2

sources:
  - name: raw
    description: Raw files, loaded as-is by load_raw.py
    tables:
      - name: orders
        description: One row per line of the daily orders file, all columns as text
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
